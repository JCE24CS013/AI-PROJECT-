{% extends 'core/base.html' %}
{% block title %}Password Reset Requested{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="alert alert-success">
                If an account exists for the email address you entered, a password reset link has been sent.
            </div>
            <a href="{% url 'login' %}" class="btn btn-primary">Back to login</a>
        </div>
    </div>
</div>
{% endblock %}
