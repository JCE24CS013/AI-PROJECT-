{% extends 'core/base.html' %}
{% block title %}Restaurant Owner Registration{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h2 class="mb-4 text-center">Restaurant Owner Registration</h2>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button class="btn btn-primary w-100" type="submit">Create Owner Account</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
